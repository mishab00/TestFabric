[tool.poetry]
name = "testfabric"
version = "0.1.0"
description = "Distributed execution fabric for pytest workloads"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"

packages = [{ include = "testfabric" }]

[tool.poetry.dependencies]
python = ">=3.11"
pydantic = { version = ">=2.7", optional = true }
pyyaml = { version = ">=6.0", optional = true }
typer = { version = ">=0.9", optional = true }
gitpython = { version = "^3.1.45", optional = true }
docker = { version = "^7.1.0", optional = true }
paramiko = { version = "^4.0.0", optional = true }
pytest = { version = ">=7.4,<9", optional = true }
fastapi = { version = "^0.135.3", optional = true }
httpx = { version = "^0.28.1", optional = true }
uvicorn = { version = "^0.44.0", optional = true }
sqlalchemy = { version = "^2.0.49", optional = true }
allure-pytest = { version = ">=2.13", optional = true }

# ┌──────────────────────────────────────────────────────────────────────┐
# │                     MICRO-PACKAGE EXTRAS                            │
# │                                                                     │
# │  Each extra maps to a reusable capability boundary.                │
# │  Install only what you need:                                        │
# │                                                                     │
# │    pip install testfabric[parallel]     # parallel task dispatch    │
# │    pip install testfabric[docker]       # Docker-wrapped execution │
# │    pip install testfabric[ssh]          # remote host execution    │
# │    pip install testfabric[watch]        # reactive file/http watch │
# │    pip install testfabric[yaml]         # YAML spec + schema      │
# │    pip install testfabric[reporting]    # stage/run reporting      │
# │    pip install testfabric[orchestration]# full pipeline engine     │
# │    pip install testfabric[server]       # API server (FastAPI)     │
# │    pip install testfabric[pytest]       # pytest integration       │
# │    pip install testfabric[allure]       # Allure evidence          │
# │    pip install testfabric[all]          # everything               │
# └──────────────────────────────────────────────────────────────────────┘

[tool.poetry.extras]
# ── Leaf micro-packages (no extra deps) ──
# testfabric.core       — events, contracts, redaction, env helpers (stdlib only)
# testfabric.execution  — local executor, runner protocols (stdlib only)
# testfabric.workers    — worker pool, target loading (stdlib only, yaml opt)
# testfabric.watch      — reactive watchers (stdlib only)
# testfabric.evidence   — evidence recorder (stdlib only)

# ── Capability extras ──
pytest = ["pytest"]

# Run tasks inside Docker containers
docker = ["docker"]

# Run tasks on remote hosts via SSH
ssh = ["paramiko"]

# Parallel task dispatch (stdlib ThreadPoolExecutor — no extra deps needed,
# but grouping as an install target for clarity)
parallel = []

# Reactive watchers (file, HTTP, metric, remote-file) — stdlib only
watch = []

# YAML-driven spec schema, validation, linting, parametrization
yaml = ["pydantic", "pyyaml"]

# Stage/run reporting with artifact collection
reporting = ["pydantic"]

# Full YAML-driven orchestration (plan → health → stages → report)
orchestration = ["gitpython", "pydantic", "pyyaml", "typer"]

# API server for remote/portal runs
server = ["fastapi", "httpx", "pydantic", "sqlalchemy", "uvicorn"]

# Allure evidence integration
allure = ["allure-pytest"]

# Everything
all = [
    "allure-pytest",
    "docker",
    "fastapi",
    "gitpython",
    "httpx",
    "paramiko",
    "pydantic",
    "pytest",
    "pyyaml",
    "sqlalchemy",
    "typer",
    "uvicorn",
]

[tool.poetry.scripts]
testfabric = "testfabric.cli.main:main"

[build-system]
requires = ["poetry-core>=1.7"]
build-backend = "poetry.core.masonry.api"
