# run.local.yaml  (MVP)
run:
  name: "jumpbox-mvp"
  repo_url: "git@bits.linode.com:Linode/NLB-Testing.git"
  ref: "NB-2598-nlb-performance"
  workdir: "testfabric/nlb_work"
  artifacts_dir: "testfabric/runs"
  runs_subdir: "runs"
  workers_tmp: "testfabric/runs/workers_tmp"
  run_id: null

inputs:
  env_name:
    required: true
  token:
    type: secret
    env: TOKEN
    required: true
  artifactory_username:
    env: ARTIFACTORY_USERNAME
    required: true
  artifactory_api_key:
    type: secret
    env: ARTIFACTORY_API_KEY
    required: true
  registry_username:
    env: USERNAME
    required: true
  registry_password:
    type: secret
    env: PASSWORD
    required: true

profiles:
  remote:
    inputs:
      env_name: remote
  devenv:
    inputs:
      env_name: devenv

workers:
  mode: local
  max_workers: 100
  workdir: null
  inventory: null
  selector: null
  transport: null
  reuse: false
  ttl: null

pipeline:
  stages:
    - title: "precheck on jumpbox"
      suite: smoke_cmd
      executor: local

    - title: "build docker image"
      suite: noop_cmd
      executor: docker
      build: true

    - title: "run e2e pytest"
      suite: e2e
      executor: docker

    - title: "post actions"
      suite: post_cmd
      executor: local

suites:
  e2e:
    kind: pytest
    path: tests/performance
    rootdir: tests/performance
    select:
      - test_bringup_env.py::test_sleep_15_seconds
    args: "--env=${inputs.env_name} --token=${inputs.token} --setup-show"
    extra_env:
      TOKEN: "${inputs.token}"

  e2c:
    kind: pytest
    path: tests/performance
    rootdir: tests/performance
    select:
      - test_bringup_env.py::test_sleep_30_seconds
    args: "--env=${inputs.env_name} --token=${inputs.token} --setup-show"
    extra_env:
      TOKEN: "${inputs.token}"

  smoke_cmd:
    kind: command
    executor: docker
    steps:
      - name: precheck
        cmd: ["bash", "-lc", "uname -a && whoami"]

  post_cmd:
    kind: command
    steps:
      - name: done
        cmd: ["bash", "-lc", "echo finished"]

  noop_cmd:
    kind: command
    steps:
      - name: noop
        cmd: ["bash", "-lc", "true"]

docker:
  dockerfile: "tests/performance/Dockerfile"
  image: "your-repo-tests:ci"
  workdir: "/workspace"
  repo_mount: "/workspace"
  build_args:
    ARTIFACTORY_USERNAME: "${inputs.artifactory_username}"
    ARTIFACTORY_API_KEY: "${inputs.artifactory_api_key}"
    USERNAME: "${inputs.registry_username}"
    PASSWORD: "${inputs.registry_password}"
  no_cache: true
  run:
    shm_size: "1g"
    network: "host"
    env: {}
    keep_container: false

parallelism:
  max_workers: 90
  chunk_size: 1
  max_retries: 3

outputs:
  junit: "junit.xml"
  html: "report.html"
