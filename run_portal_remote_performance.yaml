run:
  name: "portal-remote-performance"
  repo_url: "."
  ref: "HEAD"
  workdir: ".testfabric/work"
  artifacts_dir: "artifacts"

targets:
  file: watch_remote_file_targets.yaml

credentials:
  file: watch_remote_file_credentials.yaml

watch:
  phases: [run, stage, job]
  sources:
    - name: remote_cpu_metric
      type: metric
      phases: [stage]
      target: remote-log-host
      mode: poll
      interval_seconds: 1
      shell: echo "92.5"
  watchers:
    - name: remote_metric_over_90
      source: remote_cpu_metric
      when:
        gt: 90
      then:
        report:
          message: "Remote host metric crossed 90%"

pipeline:
  stages:
    - title: "remote performance watch"
      suite: portal_remote_metric
      executor: local

suites:
  portal_remote_metric:
    kind: command
    steps:
      - name: hold_window_open
        shell: sleep 4

outputs:
  junit: null
  html: null
