# Run with Poetry:
#   poetry run testfabric run_split_local.yaml
# Run without Poetry (if this Python already has TestFabric deps installed):
#   python3 -m testfabric.cli.main run_split_local.yaml
# This example uses split groups locally and sets stage max_workers directly.

pipeline:
  stages:
    - title: split shell steps locally
      suite: split_cmd
      max_workers: 3
      split:
        count: 3

suites:
  split_cmd:
    steps:
      - name: step-1
        bash:
          - mkdir -p "$TESTFABRIC_JOB_ARTIFACTS_DIR"
          - echo "step-1" > "$TESTFABRIC_JOB_ARTIFACTS_DIR/step-1.txt"
      - name: step-2
        bash:
          - mkdir -p "$TESTFABRIC_JOB_ARTIFACTS_DIR"
          - echo "step-2" > "$TESTFABRIC_JOB_ARTIFACTS_DIR/step-2.txt"
      - name: step-3
        bash:
          - mkdir -p "$TESTFABRIC_JOB_ARTIFACTS_DIR"
          - echo "step-3" > "$TESTFABRIC_JOB_ARTIFACTS_DIR/step-3.txt"
      - name: step-4
        bash:
          - mkdir -p "$TESTFABRIC_JOB_ARTIFACTS_DIR"
          - echo "step-4" > "$TESTFABRIC_JOB_ARTIFACTS_DIR/step-4.txt"

outputs:
  junit: null
  html: null
